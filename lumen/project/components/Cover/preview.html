<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lumen — cover</title>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--canvas); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .orange { fill: var(--chart-2); }
  .glass { fill: var(--glass); }
  .soft { fill: var(--accent-soft); }
  .slab { rx: var(--radius-xl); }
  .block { rx: var(--radius-lg); }
  .pill { rx: 14px; }
  .pill-lg { rx: 56px; }
  .name { position: absolute; left: 40px; bottom: 56px; max-width: 440px; margin: 0; font-family: var(--font-sans); font-size: 120px; font-weight: 600; line-height: 0.92; letter-spacing: -0.04em; color: var(--ink); }
  .tagline { position: absolute; left: 44px; bottom: 28px; max-width: 440px; margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: accent slab 200×240 (radius-xl), ink block 200×112 (radius-lg), chart-2 pill 200×112 (radius-pill = 56)
    arrangement: one tall slab with two satellites, right of x = 520, 16px gaps (space-4), 24px margins (space-6)
    pattern: pills, from "soft, not sharp" and "glass is rare": 4 glass task pills stacked on the slab, 2 accent-soft pills on the ink block
    scales: pill 152×28 rx 14, row pitch 44 (space-12 − 4), gaps space-4, radii radius-lg / radius-xl / pill
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="accent slab" x="520" y="24" width="200" height="240" />
    <rect class="glass pill" x="544" y="56" width="152" height="28" />
    <rect class="glass pill" x="544" y="100" width="120" height="28" />
    <rect class="glass pill" x="544" y="144" width="152" height="28" />
    <rect class="glass pill" x="544" y="188" width="96" height="28" />
    <rect class="ink block" x="736" y="24" width="200" height="112" />
    <rect class="soft pill" x="760" y="52" width="104" height="24" />
    <rect class="soft pill" x="760" y="88" width="152" height="24" />
    <rect class="orange pill-lg" x="736" y="152" width="200" height="112" />
  </svg>
  <h1 class="name">Lumen</h1>
  <p class="tagline">Soft surfaces for agent work, guide books and charts.</p>
</div>
</body>
</html>
