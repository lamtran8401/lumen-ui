<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CodeBlock — preview</title>
<style>
  body { padding: 20px; background: var(--canvas); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pv-col { display: flex; flex-direction: column; gap: 16px; max-width: 680px; }
  .pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
</style>
</head>
<body>
<div id="root" class="pv-col"></div>
<script>
  var L = window.Lumen, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h(L.CodeBlock, { filename: 'otel.config.ts', code: "export const sampler = new TraceIdRatioBasedSampler(0.1)\n\n// keep every error trace\nexport const keepErrors = (span) => span.status.code === SpanStatusCode.ERROR" }));
</script>
</body>
</html>
