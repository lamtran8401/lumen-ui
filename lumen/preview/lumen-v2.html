    { id: 'ex-run', name: 'Assistant chat', summary: 'Message + Disclosure + Timeline + PromptInput.', render: () => `<div class="row" style="align-items:flex-start;gap:16px"><div class="stack" style="flex:1 1 360px;gap:16px">${C.message({ author: 'You', align: 'end', bubble: true, text: 'Why did the ingest job fail last night?' })}${C.message({ author: 'Ops agent', html: `<p>The job hit the 512 MB memory limit at 02:14. The batch holds 50,000 rows at peak.</p><div class="stack" style="gap:8px">${C.disclosure({ status: 'done', open: true, meta: 'src/ingest/worker.ts' })}${C.disclosure({ status: 'failed', name: 'deploy', meta: '--env staging', end: '14 s', body: 'approval required for env=staging' })}</div>` })}${C.event({})}${C.prompt({ placeholder: 'Reply to Ops agent…' })}</div><div class="surface r-card" style="flex:1 1 280px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>Run #318</h3>${U.button({ variant: 'danger', size: 'sm', icon: 'stop', label: 'Stop' })}</div>${C.timeline({ steps: runSteps })}</div></div>` },
    { id: 'ex-guide', name: 'Article', summary: 'Callout + CodeBlock + DataTable on a reading column.', render: () => `<article class="stack" style="max-width:660px;margin:0 auto;gap:16px"><span class="mono" style="font-size:12px;color:var(--blue-ink)">Engineering blog · 6 min read</span><h2 style="margin:0;font-size:28px;line-height:34px;letter-spacing:-.025em">Follow one request through four services</h2><p style="margin:0;font-size:17px;line-height:28px;color:var(--fg-muted)">A trace records the path of one request. Each hop adds a span with a start time, a duration and a status.</p>${C.callout({ kind: 'in-short' })}<p style="margin:0;font-size:15.5px;line-height:26px">The SDK adds a <code class="mono" style="font-size:.88em;padding:1px 6px;border-radius:6px;background:var(--track)">traceparent</code> header to every outgoing call. The next service reads it and continues the trace.</p>${C.code({})}${C.table({ cols: ['Traffic', 'Sample rate', 'Spans kept / s'], rows: [['Below 200 req/s', '100%', '200'], ['200 – 2,000 req/s', '25%', '500'], ['Above 2,000 req/s', '10%', '200+']] })}${C.callout({ kind: 'watch-out', text: 'A label with user IDs creates one time series for each user.' })}</article>` },
    { id: 'ex-dash', name: 'Dashboard', summary: 'StatCard + ChartCard + ListRow + Diagram.', render: () => `<div class="stack" style="gap:14px"><div class="row" style="align-items:stretch">${C.stat({})}${C.stat({ label: 'p95 latency', value: '412', unit: 'ms', delta: 8, goodWhen: 'down', vs: 'vs last week', trend: [380, 360, 390, 400, 410, 405, 412] })}${C.stat({ label: 'Open blockers', value: '3', delta: 0, vs: 'no change', spark: false })}</div><div class="row" style="align-items:stretch">${C.chartCard({ title: 'Latency by service (ms)' })}${C.list([C.listRow({ lead: 'dot', tone: 'blue', pulse: true, title: 'Nightly ingest', meta: 'running · 14 min', end: U.button({ variant: 'plain', size: 'sm', label: 'Open' }) }), C.listRow({ lead: 'dot', tone: 'red', title: 'Deploy to staging', meta: 'failed · approval required', end: U.button({ variant: 'ink', size: 'sm', label: 'Approve' }) }), C.listRow({ lead: 'dot', tone: 'green', title: 'Weekly report', meta: 'done · 4 min ago', end: '' })])}</div>${C.diagram()}</div>` },
  ];

  const FOUNDATIONS = [
    { id: 'colors', name: 'Color', summary: 'Cool neutrals with a hint of blue. Ink is the main action. A hue appears only when it carries a meaning: accent, success, warning or danger.', render: () => {
      const sw = (n, v, use) => `<div class="sw"><b class="r-row" style="background:var(${v})"></b>${n}<code>${v}</code><span>${use}</span></div>`;
      return `<div class="stack" style="width:100%;gap:20px"><span class="label">Neutrals</span><div class="swatches">${sw('Ground', '--bg', 'page, sidebar')}${sw('Ground muted', '--bg-muted', 'wells, canvas')}${sw('Surface', '--surface', 'cards, sheets')}${sw('Track', '--track', 'tracks, hover')}${sw('Ink', '--fg', 'text, main action')}${sw('Muted', '--fg-muted', 'secondary text')}${sw('Subtle', '--fg-subtle', 'meta, placeholder')}${sw('Border', '--border', 'input outline')}</div><span class="label">Meaning</span><div class="swatches">${sw('Blue', '--blue', 'accent, info, links, focus')}${sw('Amber', '--amber', 'warning, attention')}${sw('Green', '--green', 'success')}${sw('Red', '--red', 'danger, error')}${sw('Violet', '--violet', 'extra category')}</div><span class="label">Charts (fixed order)</span><div class="swatches">${['1', '2', '3', '4', '5'].map((i) => sw('Series ' + i, '--c' + i, ['blue', 'orange', 'aqua', 'yellow', 'magenta'][i - 1])).join('')}</div></div>`; } },
    { id: 'type', name: 'Typography', summary: 'Geist for text, Geist Mono for IDs, times and code.', render: () => `<div style="width:100%">${[['display 30/36 · 600', 'font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em', 'Signals, not noise'], ['title 20/28 · 600', 'font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em', 'Weekly board'], ['heading 15/22 · 600', 'font-size:15px;line-height:22px;font-weight:600', 'Run #318'], ['body 14.5/23', 'font-size:14.5px;line-height:23px', 'The agent opened 3 pull requests and waits for review.'], ['small 13/18', 'font-size:13px;color:var(--fg-muted)', 'Updated 4 min ago'], ['label 11 caps', 'font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);font-weight:500', 'Output'], ['mono 12', 'font:400 12px var(--mono)', '#41 · Nov 8 · 02:14:09'], ['metric 30 · tabular', 'font-size:30px;font-weight:500;letter-spacing:-.035em;font-variant-numeric:tabular-nums', '1,284']].map(([c, s, t]) => `<div class="type-row"><code>${c}</code><span style="${s}">${t}</span></div>`).join('')}</div>` },
    { id: 'radius', name: 'Radius and corners', summary: 'Every rounded element names a role. Use the toolbar to compare continuous and round corners, and the soft and subtle levels.', render: () => `<div class="stack" style="width:100%;gap:16px"><div class="shapes">${['panel', 'card', 'item', 'row', 'chip', 'ctl'].map((r) => `<div class="shape"><b class="r-${r}"></b>${r === 'ctl' ? 'control' : r}<span class="rv" data-r="${r}"></span></div>`).join('')}</div><p class="muted" style="margin:0;font-size:13px">Continuous corners use <code class="mono">corner-shape: superellipse(1.5)</code> at 1.3× the radius. A browser without it draws the plain radius. Nested radius = outer radius − padding.</p></div>` },
    { id: 'elevation', name: 'Elevation', summary: 'A shadow draws an edge: a 0.5px ring plus a soft drop. Hover never lifts a surface; it darkens the edge. A colored glow marks attention only.', render: () => `<div class="levels">${[['Frame', 'flat, hairline', 'box-shadow:inset 0 0 0 1px var(--hair)'], ['Card', 'shadow 1', 'background:var(--surface);box-shadow:var(--shadow-1)'], ['Hover', 'edge darkens, no lift', 'background:var(--surface);box-shadow:var(--shadow-hover)'], ['Raised', 'shadow 2: open, dragged', 'background:var(--surface);box-shadow:var(--shadow-2)'], ['Float', 'shadow 3: menus, toasts', 'background:var(--surface);box-shadow:var(--shadow-3)'], ['Glow', 'attention only: needs you, blocked, selected', 'background:var(--surface);box-shadow:0 0 0 1px color-mix(in oklch, var(--amber) 55%, transparent), 0 4px 14px -6px color-mix(in oklch, var(--amber) 35%, transparent)']].map(([n, d, s]) => `<div class="lvl r-card" style="${s}"><div>${n}<small>${d}</small></div></div>`).join('')}</div>` },
    { id: 'motion', name: 'Motion', summary: 'Motion explains a change. Press shrinks to 0.97. Thumbs and panels move on one spring curve.', render: () => `<div class="stack" style="width:100%"><div class="motion-demo" id="motion-demo">${[['Spring', 'var(--ease)', '420ms'], ['Out', 'var(--out)', '320ms'], ['Linear (avoid)', 'linear', '320ms']].map(([n, e, d]) => `<div class="stack" style="gap:6px"><span style="font-size:13px;font-weight:500">${n}</span><div class="track r-ctl"><span class="ball" style="transition:left ${d} ${e}"></span></div></div>`).join('')}</div><div>${U.button({ variant: 'plain', icon: 'play', label: 'Play' }).replace('<button', '<button id="motion-play"')}</div></div>` },
    { id: 'icons', name: 'Icons', summary: 'Lucide icons at 15–16px, stroke 2. A status icon takes its tone.', render: () => `<div class="icon-grid">${['check', 'x', 'dash', 'run', 'plus', 'search', 'chev', 'right', 'up', 'clip', 'copy', 'info', 'bulb', 'warn', 'play', 'stop', 'file', 'inbox', 'bolt', 'gear', 'user', 'bot', 'cal', 'menu'].map((n) => `<div class="r-row">${icon(n)}${n}</div>`).join('')}</div>` },
  ];

  const byId = new Map([...ENTRIES, ...EXAMPLES, ...FOUNDATIONS].map((e) => [e.id, e]));
  const usedIn = (id) => ENTRIES.filter((e) => e.uses?.includes(id));

  /* ---------- sidebar ---------- */
  function buildTree(filter = '') {
    const f = filter.trim().toLowerCase();
    const match = (e) => !f || e.name.toLowerCase().includes(f) || (e.group ?? '').toLowerCase().includes(f);
    const link = (e, glyph, lvl = '') => `<a href="#${e.id}" data-id="${e.id}"><span class="gl ${glyph}"></span>${esc(e.name)}${lvl ? `<span class="lvl">${lvl}</span>` : ''}</a>`;
    const units = ENTRIES.filter((e) => e.level === 'unit' && match(e));
    const comps = ENTRIES.filter((e) => e.level === 'composition' && match(e));
    let html = '';
    if (!f) html += `<div class="tree__group">Docs</div><a href="#overview" data-id="overview"><span class="gl x"></span>Overview</a>`;
    const fnd = FOUNDATIONS.filter(match);
    if (fnd.length) html += `<div class="tree__group">Foundations</div>${fnd.map((e) => link(e, 'x')).join('')}`;
    if (units.length) html += `<div class="tree__group">Units<span>${units.length}</span></div>${units.map((e) => link(e, '')).join('')}`;
    if (comps.length) html += `<div class="tree__group">Compositions<span>${comps.length}</span></div>${comps.map((e) => link(e, 'c', e.uses.length)).join('')}`;
    const ex = EXAMPLES.filter(match);
    if (ex.length) html += `<div class="tree__group">Examples</div>${ex.map((e) => link(e, 'x')).join('')}`;
    $('#tree').innerHTML = html || '<p class="muted" style="padding:10px;font-size:13px">No match</p>';
    markCurrent();
  }
  function markCurrent() {
    const id = location.hash.slice(1) || 'overview';
    $$('#tree a').forEach((a) => { if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  /* ---------- pages ---------- */
  const crumb = (...parts) => `<div class="crumb">${parts.join(' <span>/</span> ')}</div>`;
  const levelBadge = (e) => e.level === 'unit' ? U.badge({ tone: 'grey', label: 'Unit' }) : U.badge({ tone: 'violet', label: 'Composition' });

  function overview() {
    const units = ENTRIES.filter((e) => e.level === 'unit');
    const comps = ENTRIES.filter((e) => e.level === 'composition');
    const chip = (id) => `<a class="tag tag--line r-chip" href="#${id}">${esc(byId.get(id).name)}</a>`;
    return `${crumb('Docs')}<div class="doc-head"><div><h1>Lumen v2</h1><p>A general-purpose design system for any product: apps, settings, commerce, dashboards, docs and agent tools. <b>Units</b> are the smallest parts. <b>Compositions</b> combine units into generic patterns. A product screen combines compositions.</p></div><div class="row">${U.badge({ tone: 'grey', label: units.length + ' units' })}${U.badge({ tone: 'violet', label: comps.length + ' compositions' })}</div></div>
      <div class="prose"><ul><li>Each page has a Playground with Controls and Code, then Stories, then Props.</li><li>A composition lists the units it is <b>built from</b>. A unit lists where it is <b>used in</b>.</li><li>The toolbar switches theme, corner shape and radius level for every page.</li></ul></div>
      <h2 class="doc-h2">Component unit list <small>${ENTRIES.length} components</small></h2>
      <div class="props-wrap r-row"><table><thead><tr><th>Name</th><th>Level</th><th>Group</th><th>Built from</th><th>Used in</th></tr></thead><tbody>${ENTRIES.map((e) => `<tr><td><a href="#${e.id}" style="color:var(--fg);font-weight:500;text-decoration:none">${esc(e.name)}</a></td><td>${levelBadge(e)}</td><td class="muted">${esc(e.group)}</td><td><div class="row" style="gap:4px">${(e.uses ?? []).map(chip).join('') || '<span class="muted">—</span>'}</div></td><td><div class="row" style="gap:4px">${usedIn(e.id).map((u) => chip(u.id)).join('') || '<span class="muted">—</span>'}</div></td></tr>`).join('')}</tbody></table></div>
      <h2 class="doc-h2">Examples <small>screens from different products, made only of compositions</small></h2>
      <div class="overview-grid">${EXAMPLES.map((e) => `<a class="ov-card r-card" href="#${e.id}"><span class="k">EXAMPLE</span><b>${esc(e.name)}</b><span>${esc(e.summary)}</span></a>`).join('')}</div>`;
  }

  function defaults(e) { return Object.fromEntries((e.props ?? []).map((p) => [p.name, p.default])); }
  function controlFor(p, v) {
    if (p.type === 'select') return `<select class="ctl-select r-ctl" data-prop="${p.name}" aria-label="${p.name}">${p.options.map((o) => `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${o === '' ? '(none)' : esc(o)}</option>`).join('')}</select>`;
    if (p.type === 'bool') return `<label class="switch"><input type="checkbox" data-prop="${p.name}"${v ? ' checked' : ''} aria-label="${p.name}"><span class="switch__track"><span class="switch__knob"></span></span></label>`;
    if (p.type === 'range') return `<span class="row" style="gap:10px;width:100%"><input class="ctl-range" type="range" min="${p.min}" max="${p.max}" value="${v}" data-prop="${p.name}" aria-label="${p.name}"><span class="mono" style="font-size:12px;min-width:24px">${v}</span></span>`;
    return `<input class="ctl-text r-ctl" value="${esc(v)}" data-prop="${p.name}" aria-label="${p.name}">`;
  }

  function componentPage(e) {
    const args = defaults(e);
    const isWide = ['shell-sidebar', 'shell-topnav', 'shell-split', 'shell-mobile', 'alert', 'accordion', 'dialog', 'sheet', 'topbar', 'dl', 'file-drop', 'command', 'column', 'chart', 'diagram', 'table', 'action', 'list-row', 'message', 'prompt', 'callout', 'code', 'disclosure', 'stages', 'timeline'].includes(e.id);
    const rel = (title, ids) => `<div class="rel r-row"><b>${title}</b><div class="links">${ids.length ? ids.map((id) => `<a class="tag tag--line r-chip" href="#${id}">${esc(byId.get(id).name)}</a>`).join('') : '<span class="none">—</span>'}</div></div>`;
    return `${crumb(`<a href="#overview">Docs</a>`, e.level === 'unit' ? 'Units' : 'Compositions', esc(e.group))}
      <div class="doc-head"><div><h1>${esc(e.name)}</h1><p>${esc(e.summary)}</p></div><div class="row">${levelBadge(e)}</div></div>
      <div class="canvas dots r-card${isWide ? ' wide' : ''}" id="pg"><div class="stage-in">${e.render(args)}</div></div>
      ${(e.props ?? []).length ? `<div class="addons r-card"><div class="addons__tabs" role="tablist"><button role="tab" aria-selected="true" data-panel="controls">Controls</button><button role="tab" aria-selected="false" data-panel="code">Code</button></div>
        <div data-pane="controls"><div class="controls"><div class="hd">Name</div><div class="hd">Control</div><div class="hd pd">Description</div>${e.props.map((p) => `<div class="pn">${p.name}</div><div>${controlFor(p, args[p.name])}</div><div class="pd">${esc(p.desc)}</div>`).join('')}</div></div>
        <div data-pane="code" hidden><pre class="codeview" id="codeview"></pre></div></div>` : ''}
      ${e.stories.length ? `<h2 class="doc-h2">Stories <small>${e.stories.length}</small></h2><div class="stories">${e.stories.map(([n, note, fn]) => `<div class="story"><div class="story__name">${esc(n)}</div>${note ? `<p class="story__note">${esc(note)}</p>` : ''}<div class="canvas dots r-card wide"><div class="stage-in" style="display:flex;justify-content:center">${fn()}</div></div></div>`).join('')}</div>` : ''}
      <h2 class="doc-h2">Relations</h2><div class="relations">${rel('Built from', e.uses ?? [])}${rel('Used in', usedIn(e.id).map((u) => u.id))}</div>
      ${(e.props ?? []).length ? `<h2 class="doc-h2">Props</h2><div class="props-wrap r-row"><table><thead><tr><th>Prop</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>${e.props.map((p) => `<tr><td class="mono">${p.name}</td><td>${p.type === 'select' ? p.options.filter((o) => o !== '').map((o) => `<code>${esc(o)}</code>`).join(' ') : `<code>${{ bool: 'boolean', range: 'number', text: 'string' }[p.type]}</code>`}</td><td>${p.default === '' ? '—' : `<code>${esc(p.default)}</code>`}</td><td class="muted">${esc(p.desc)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  }

  function simplePage(e, section) {
    return `${crumb(`<a href="#overview">Docs</a>`, section)}<div class="doc-head"><div><h1>${esc(e.name)}</h1><p>${esc(e.summary)}</p></div></div><div class="canvas${section === 'Examples' ? '' : ' dots'} r-card wide" style="padding:${section === 'Examples' ? '24px' : '28px'}"><div class="stage-in">${e.render()}</div></div>`;
  }

  /* ---------- behaviour ---------- */
  function placeThumb(seg) {
    const t = seg.querySelector('.seg__thumb'), on = seg.querySelector('button[aria-selected="true"]');
    if (!t || !on || !seg.offsetWidth) return;
    t.style.width = on.offsetWidth + 'px'; t.style.transform = `translateX(${on.offsetLeft - 3}px)`; t.style.left = '3px';
  }
  function hydrate(root) {
    $$('[data-seg]', root).forEach((seg) => { if (seg.dataset.bound) return; seg.dataset.bound = 1; seg.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; $$('button', seg).forEach((x) => x.setAttribute('aria-selected', String(x === b))); placeThumb(seg); }); placeThumb(seg); });
    $$('[data-tabs]', root).forEach((tabs) => tabs.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; $$('button', tabs).forEach((x) => x.setAttribute('aria-selected', String(x === b))); }));
    $$('.disc__head', root).forEach((h) => h.addEventListener('click', () => { const d = h.closest('.disc'); d.classList.toggle('is-open'); h.setAttribute('aria-expanded', String(d.classList.contains('is-open'))); }));
    $$('.option', root).forEach((o) => o.addEventListener('click', () => { $$('.option', o.parentElement).forEach((x) => x.setAttribute('aria-checked', String(x === o))); }));
    $$('.stages__seg', root).forEach((s) => s.addEventListener('click', () => s.setAttribute('aria-pressed', String(s.getAttribute('aria-pressed') !== 'true'))));
    $$('.card.is-interactive', root).forEach((c) => c.addEventListener('click', () => c.classList.toggle('ring-blue')));
    $$('[data-copy]', root).forEach((b) => b.addEventListener('click', async () => {
      const text = b.closest('.code').querySelector('pre').textContent;
      try { await navigator.clipboard.writeText(text); b.lastChild.textContent = 'Copied'; } catch { b.lastChild.textContent = 'Select to copy'; }
      setTimeout(() => { b.lastChild.textContent = 'Copy'; }, 1400);
    }));
    $$('.prompt textarea', root).forEach((t) => t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); t.value = ''; } }));
    $$('.acc__head', root).forEach((h) => h.addEventListener('click', () => { const it = h.closest('.acc__item'), open = !it.classList.contains('is-open'); $$('.acc__item', it.parentElement).forEach((x) => { x.classList.remove('is-open'); x.querySelector('.acc__head').setAttribute('aria-expanded', 'false'); }); it.classList.toggle('is-open', open); h.setAttribute('aria-expanded', String(open)); }));
    $$('[data-day]', root).forEach((d) => d.addEventListener('click', () => { $$('[data-day]', d.parentElement).forEach((x) => x.setAttribute('aria-pressed', String(x === d))); }));
    $$('[data-page]', root).forEach((b) => b.addEventListener('click', () => { $$('[data-page]', b.parentElement).forEach((x) => x.toggleAttribute('aria-current', x === b)); b.setAttribute('aria-current', 'page'); }));
    $$('.slider input', root).forEach((r) => r.addEventListener('input', () => { const p = (r.value - r.min) / ((r.max - r.min) || 1) * 100; r.style.setProperty('--p', p + '%'); const o = r.closest('.slider').querySelector('[data-out]'); if (o) o.textContent = r.value + (r.dataset.unit ?? ''); }));
    $$('[data-nav]', root).forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); const group = a.closest('nav'); if (group) { $$('[data-nav]', group).forEach((x) => x.removeAttribute('aria-current')); a.setAttribute('aria-current', 'page'); } }));
    $$('[data-chart]', root).forEach((c) => (c.dataset.chart === 'bar' ? barChart(c) : lineChart(c, +c.dataset.series || 3)));
    showRadii();
  }

  function mountPage() {
    const id = location.hash.slice(1) || 'overview';
    const view = $('#view');
    const e = byId.get(id);
    if (!e) view.innerHTML = overview();
    else if (FOUNDATIONS.includes(e)) view.innerHTML = simplePage(e, 'Foundations');
    else if (EXAMPLES.includes(e)) view.innerHTML = simplePage(e, 'Examples');
    else view.innerHTML = componentPage(e);
    hydrate(view);
    if (e && ENTRIES.includes(e)) bindControls(e);
    if (id === 'motion') $('#motion-play')?.addEventListener('click', () => $('#motion-demo').classList.toggle('go'));
    markCurrent();
    $('#side').classList.remove('is-open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
    document.scrollingElement.scrollTop = 0;
  }

  function bindControls(e) {
    const args = defaults(e);
    const code = () => { const c = $('#codeview'); if (c) c.textContent = jsx(e.name, args); };
    const paint = () => { const pg = $('#pg .stage-in'); pg.innerHTML = e.render(args); hydrate(pg); code(); };
    $$('[data-prop]').forEach((el) => {
      const evt = el.type === 'text' || el.tagName === 'INPUT' && el.type !== 'checkbox' ? 'input' : 'change';
      el.addEventListener(evt, () => {
        const p = e.props.find((x) => x.name === el.dataset.prop);
        args[p.name] = p.type === 'bool' ? el.checked : p.type === 'range' ? +el.value : el.value;
        if (p.type === 'range') el.nextElementSibling.textContent = el.value;
        if (p.name === 'state' && args.state === 'default') args.state = undefined;
        paint();
      });
    });
    $$('.addons__tabs button').forEach((b) => b.addEventListener('click', () => {
      $$('.addons__tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      $$('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== b.dataset.panel; });
    }));
    code();
  }

  /* ---------- charts: one linear scale; ticks on a 1-2-2.5-5 step so labels read as round numbers ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent?.appendChild(n); return n; };
  const niceStep = (raw) => { const m = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].find((s) => s * m >= raw) * m; };
  const axis = (max, count = 4) => { const step = niceStep(max / count); return { top: Math.ceil(max / step) * step, step }; };
  function tooltip(host) { const t = document.createElement('div'); t.className = 'tip r-row'; host.appendChild(t); return t; }
  function showTip(t, host, x, y, title, rows) {
    t.innerHTML = `<b>${title}</b>` + rows.map((r) => `<div><i style="background:${r.c}"></i><span>${r.n}</span><span>${r.v}</span></div>`).join('');
    const w = host.clientWidth, left = x > w - 180 ? x - t.offsetWidth - 12 : x + 12;
    t.style.left = left + 'px'; t.style.top = Math.max(0, y - 30) + 'px'; t.classList.add('on');
  }
  function lineChart(host, count) {
    const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const all = [
      { n: 'api', v: [120, 118, 160, 210, 190, 150, 130] }, { n: 'ingest', v: [300, 280, 260, 340, 420, 380, 310] },
      { n: 'search', v: [80, 90, 110, 140, 120, 100, 90] }, { n: 'auth', v: [60, 64, 70, 76, 72, 66, 62] }, { n: 'mail', v: [200, 190, 210, 230, 220, 215, 205] },
    ];
    const series = all.slice(0, Math.max(1, Math.min(5, count))).map((s, i) => ({ ...s, c: `var(--c${i + 1})` }));
    host.innerHTML = series.length > 1 ? '<div class="legend">' + series.map((s) => `<span><i style="background:${s.c}"></i>${s.n}</span>`).join('') + '</div>' : '';
    const W = 560, H = 220, P = { l: 36, r: series.length <= 4 ? 56 : 12, t: 10, b: 24 };
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Line chart' }, host);
    const { top, step } = axis(Math.max(...series.flatMap((s) => s.v)));
    const y = (v) => P.t + (1 - v / top) * (H - P.t - P.b);
    const x = (i) => P.l + i * (W - P.l - P.r) / (labels.length - 1);
    for (let v = 0; v <= top; v += step) { el('line', { class: 'grid-l', x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) }, svg); el('text', { class: 'ax', x: P.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v; }
    labels.forEach((l, i) => { el('text', { class: 'ax', x: x(i), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = l; });
    const cross = el('line', { stroke: 'var(--border-strong)', y1: P.t, y2: H - P.b, opacity: 0 }, svg);
    series.forEach((s) => {
      el('path', { d: s.v.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' '), fill: 'none', stroke: s.c, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      if (series.length <= 4) el('text', { class: 'ax', x: x(labels.length - 1) + 8, y: y(s.v.at(-1)) + 4, 'font-weight': 500 }, svg).textContent = s.n;
    });
    const dots = series.map((s) => el('circle', { r: 4.5, fill: s.c, stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 }, svg));
    const tip = tooltip(host);
    svg.addEventListener('pointermove', (ev) => {
      const box = svg.getBoundingClientRect(), sx = (ev.clientX - box.left) * W / box.width;
      const i = Math.max(0, Math.min(labels.length - 1, Math.round((sx - P.l) / ((W - P.l - P.r) / (labels.length - 1)))));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', 1);
      dots.forEach((d, k) => { d.setAttribute('cx', x(i)); d.setAttribute('cy', y(series[k].v[i])); d.setAttribute('opacity', 1); });
      showTip(tip, host, x(i) * box.width / W, (box.top - host.getBoundingClientRect().top) + 60, labels[i], series.map((s) => ({ n: s.n, c: s.c, v: s.v[i] + ' ms' })));
    });
    svg.addEventListener('pointerleave', () => { tip.classList.remove('on'); cross.setAttribute('opacity', 0); dots.forEach((d) => d.setAttribute('opacity', 0)); });
  }
  function barChart(host) {
    const data = [['Mon', 6], ['Tue', 9], ['Wed', 4], ['Thu', 11], ['Fri', 8], ['Sat', 2], ['Sun', 3]];
    const W = 560, H = 220, P = { l: 30, r: 8, t: 10, b: 24 };
    host.innerHTML = '';
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Bar chart' }, host);
    const { top, step } = axis(Math.max(...data.map((d) => d[1])));
    const y = (v) => P.t + (1 - v / top) * (H - P.t - P.b);
    const band = (W - P.l - P.r) / data.length, bw = band * .56;
    for (let v = 0; v <= top; v += step) { el('line', { class: 'grid-l', x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) }, svg); el('text', { class: 'ax', x: P.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v; }
    const tip = tooltip(host);
    const bars = data.map(([l, v], i) => {
      const bx = P.l + i * band + (band - bw) / 2, by = y(v), bh = H - P.b - by, r = Math.min(4, bh);
      const p = el('path', { d: `M${bx},${by + bh} V${by + r} Q${bx},${by} ${bx + r},${by} H${bx + bw - r} Q${bx + bw},${by} ${bx + bw},${by + r} V${by + bh} Z`, fill: 'var(--c1)', style: 'transition:opacity 160ms' }, svg);
      el('text', { class: 'ax', x: bx + bw / 2, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = l;
      const hit = el('rect', { x: P.l + i * band, y: P.t, width: band, height: H - P.t - P.b, fill: 'transparent' }, svg);
      hit.addEventListener('pointerenter', () => { bars.forEach((b, k) => { b.style.opacity = k === i ? 1 : .5; }); const box = svg.getBoundingClientRect(); showTip(tip, host, (bx + bw / 2) * box.width / W, by * box.height / H, l, [{ n: 'Closed', c: 'var(--c1)', v }]); });
      return p;
    });
    svg.addEventListener('pointerleave', () => { tip.classList.remove('on'); bars.forEach((b) => { b.style.opacity = 1; }); });
  }

  /* ---------- toolbar ---------- */
  const root = document.documentElement;
  const apply = {
    theme(v) { v === 'system' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', v); },
    corner(v) { v === 'round' ? root.setAttribute('data-corner', 'round') : root.removeAttribute('data-corner'); },
    radius(v) { v === 'subtle' ? root.setAttribute('data-radius', 'subtle') : root.removeAttribute('data-radius'); },
  };
  function showRadii() {
    const cs = getComputedStyle(root), k = parseFloat(cs.getPropertyValue('--k')) || 1;
    $$('.rv').forEach((n) => { const base = parseFloat(cs.getPropertyValue('--r-' + n.dataset.r)); n.textContent = base >= 999 ? 'pill' : k === 1 ? `${base}px` : `${base}px × ${k}`; });
  }
  $$('[data-knob]').forEach((seg) => {
    const key = seg.dataset.knob, saved = store.get(key);
    if (saved) { $$('button', seg).forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === saved))); apply[key](saved); }
    seg.addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      $$('button', seg).forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      apply[key](b.dataset.v); store.set(key, b.dataset.v);
      requestAnimationFrame(() => { $$('.seg').forEach(placeThumb); showRadii(); });
    });
  });
  $('#menu-btn').addEventListener('click', () => { const s = $('#side'); s.classList.toggle('is-open'); $('#menu-btn').setAttribute('aria-expanded', String(s.classList.contains('is-open'))); });
  $('#tree-filter').addEventListener('input', (ev) => buildTree(ev.target.value));
  addEventListener('keydown', (ev) => { if (ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $('#tree-filter').focus(); } });
  addEventListener('hashchange', mountPage);
  addEventListener('resize', () => $$('.seg').forEach(placeThumb));

  buildTree();
  mountPage();
  $$('[data-knob]').forEach(placeThumb);
  document.fonts?.ready.then(() => $$('.seg').forEach(placeThumb));
})();
</script>
